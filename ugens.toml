# The UGens that flux-engine adds to SuperSonic's engine. scripts/prepare.py
# reads this file. It gets the UGen sources into build/ and generates the
# input of the SuperSonic hook (build/plugins/extra-plugins.cmake and
# extra-plugins.h): the source list, the build settings and the load calls.
# Do not write UGen names into SuperSonic's CMake files or SC_Lib_Cintf.cpp.

# The static UGens of isospin (https://github.com/aeskildsen/isospin). The
# release tarball has the UGen sources and class files, a CMake file with
# the source list and one load function for all its UGens, so a new isospin
# UGen needs no change here. prepare.py downloads the tarball once into
# build/downloads and checks it against sha256. To change the release,
# change both values together. ISOSPIN_DIR replaces the release with a
# working copy (a development build; see README.md).
[isospin]
version = "0.2.0"
sha256 = "05ebad33e380fa9aab6262cb52f0427a7d3184344b82b24f1b3d681b59b70075"

# MiPlaits, Volker Böhm's SuperCollider version of Mutable Instruments
# Plaits, from mi-UGens (https://github.com/v7b1/mi-UGens), a pinned
# submodule. It builds against the changed eurorack copy in mi-UGens, not
# upstream eurorack. The source list is the one of mi-UGens'
# projects/MiPlaits/CMakeLists.txt; plaits/settings.cc (firmware) is not in
# it. The patch takes the voice from the real-time pool (see the patch file).
# PluginLoad() gives C++ linkage under SuperSonic's STATIC_PLUGINS.
[[sources]]
name = "MiPlaits"
root = "mi-UGens"
patches = ["patches/mi-UGens/miplaits-rt-alloc.patch"]
sources = [
    "projects/MiPlaits/MiPlaits.cpp",
    "eurorack/plaits/resources.cc",
    "eurorack/plaits/dsp/**/*.cc",
    "eurorack/stmlib/utils/random.cc",
    "eurorack/stmlib/dsp/atan.cc",
    "eurorack/stmlib/dsp/units.cc",
]
include_dirs = ["eurorack"]
# TEST: stmlib uses portable C++, not ARM assembly.
defines = ["TEST"]
load = "MiPlaits_Load"
classes = ["sc/Classes/MiPlaits.sc"]
notice = "GPL-3.0-or-later (the mi-UGens wrapper, Volker Böhm; gpl-3.0.md in mi-UGens), with the Plaits and stmlib code under the MIT licence (Emilie Gillet; eurorack/LICENSE.txt in mi-UGens). Changed by flux-engine patches/mi-UGens/."
